<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR - Sin Librerías</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #0f3460;
            box-shadow: 0 0 0 4px rgba(15, 52, 96, 0.1);
        }

        .options-row {
            display: flex;
            gap: 15px;
        }

        .options-row .form-group {
            flex: 1;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #0f3460;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 52, 96, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .qr-output {
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        .qr-output.visible {
            display: block;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        #qrCanvas {
            display: block;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #666;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .info-item span:first-child {
            font-weight: 500;
            color: #333;
        }

        .download-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .download-btns button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error.visible {
            display: block;
        }

        .ascii-output {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 12px;
            overflow-x: auto;
            display: none;
        }

        .ascii-output.visible {
            display: block;
        }

        .ascii-output pre {
            color: #00ff00;
            font-family: monospace;
            font-size: 4px;
            line-height: 4px;
            margin: 0;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔲 Generador QR</h1>
        <p class="subtitle">100% JavaScript puro, sin librerías externas</p>

        <div class="form-group">
            <label for="text">Texto o URL:</label>
            <textarea id="text" placeholder="Escribe aquí el texto o URL que quieres codificar...">https://example.com</textarea>
        </div>

        <div class="options-row">
            <div class="form-group">
                <label for="ecLevel">Corrección de errores:</label>
                <select id="ecLevel">
                    <option value="L">L - Baja (7%)</option>
                    <option value="M" selected>M - Media (15%)</option>
                    <option value="Q">Q - Alta (25%)</option>
                    <option value="H">H - Máxima (30%)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="scale">Tamaño:</label>
                <select id="scale">
                    <option value="5">Pequeño</option>
                    <option value="10" selected>Mediano</option>
                    <option value="15">Grande</option>
                    <option value="20">Muy grande</option>
                </select>
            </div>
        </div>

        <button id="generateBtn">Generar Código QR</button>

        <div class="error" id="error"></div>

        <div class="qr-output" id="output">
            <div class="qr-container">
                <canvas id="qrCanvas"></canvas>
            </div>

            <div class="info" id="info"></div>

            <div class="download-btns">
                <button id="downloadPng">📥 Descargar PNG</button>
                <button id="downloadSvg" class="btn-secondary">📥 Descargar SVG</button>
            </div>

            <div class="ascii-output" id="asciiOutput">
                <pre id="asciiPre"></pre>
            </div>
        </div>
    </div>

    <script src="QRCode.min.js"></script>
    <script>
        let currentQR = null;

        document.getElementById('generateBtn').addEventListener('click', generateQR);
        document.getElementById('text').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') generateQR();
        });
        document.getElementById('downloadPng').addEventListener('click', downloadPNG);
        document.getElementById('downloadSvg').addEventListener('click', downloadSVG);

        function generateQR() {
            const text = document.getElementById('text').value.trim();
            const ecLevel = document.getElementById('ecLevel').value;
            const scale = parseInt(document.getElementById('scale').value);
            const errorDiv = document.getElementById('error');
            const outputDiv = document.getElementById('output');
            const canvas = document.getElementById('qrCanvas');
            const infoDiv = document.getElementById('info');
            const asciiDiv = document.getElementById('asciiOutput');
            const asciiPre = document.getElementById('asciiPre');

            errorDiv.classList.remove('visible');
            outputDiv.classList.remove('visible');
            asciiDiv.classList.remove('visible');

            if (!text) {
                errorDiv.textContent = 'Por favor, introduce un texto o URL.';
                errorDiv.classList.add('visible');
                return;
            }

            try {
                const startTime = performance.now();
                
                currentQR = new QRCode(text, { ecLevel, scale });
                currentQR.toCanvas(canvas, { scale, margin: 4 });
                
                const endTime = performance.now();
                const generationTime = (endTime - startTime).toFixed(2);

                // Mostrar información
                const byteLength = new TextEncoder().encode(text).length;
                infoDiv.innerHTML = `
                    <div class="info-item">
                        <span>Versión QR:</span>
                        <span>${currentQR.version} (${currentQR.moduleCount}×${currentQR.moduleCount} módulos)</span>
                    </div>
                    <div class="info-item">
                        <span>Nivel de corrección:</span>
                        <span>${ecLevel} (${['7%', '15%', '25%', '30%'][currentQR.ecLevel]})</span>
                    </div>
                    <div class="info-item">
                        <span>Máscara aplicada:</span>
                        <span>${currentQR.mask}</span>
                    </div>
                    <div class="info-item">
                        <span>Bytes de datos:</span>
                        <span>${byteLength}</span>
                    </div>
                    <div class="info-item">
                        <span>Tiempo de generación:</span>
                        <span>${generationTime} ms</span>
                    </div>
                `;

                // Mostrar ASCII (solo para QR pequeños)
                if (currentQR.moduleCount <= 33) {
                    asciiPre.textContent = currentQR.toString();
                    asciiDiv.classList.add('visible');
                }

                outputDiv.classList.add('visible');

            } catch (err) {
                errorDiv.textContent = `Error: ${err.message}`;
                errorDiv.classList.add('visible');
                console.error(err);
            }
        }

        function downloadPNG() {
            if (!currentQR) return;
            
            const canvas = document.createElement('canvas');
            currentQR.toCanvas(canvas, { 
                scale: 20, 
                margin: 4 
            });
            
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadSVG() {
            if (!currentQR) return;
            
            const svg = currentQR.toSVG({ scale: 10, margin: 4 });
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.download = 'qrcode.svg';
            link.href = url;
            link.click();
            
            URL.revokeObjectURL(url);
        }

        // Generar QR inicial
        generateQR();
    </script>
</body>
</html>
